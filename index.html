<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawn of Cities - Pre-alpha 7.11.26</title>
<style>
  body { font-family: sans-serif; background: #2b2b2b; color: white; text-align: center; margin: 0; }
  #hud { padding: 8px; font-size: 16px; }
  button { padding: 8px 12px; margin: 2px; font-size: 16px; }
  button.activo { background: #f5c542; }
  canvas { background: #7bb661; cursor: grab; max-width: 100%; touch-action: none; }
  .nota { font-size: 14px; margin: 4px; }
  #barra { background: #1f1f1f; padding: 6px; margin: 0 auto; max-width: 640px; }
  .pestanas, .items { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
  .pestanas button { font-size: 14px; padding: 8px 10px; margin: 0; }
  .items { margin-top: 6px; }
  .items button.item { display: flex; flex-direction: column; align-items: center; min-width: 92px; padding: 6px 8px; margin: 0; }
  .items .emo { font-size: 26px; line-height: 1.1; }
  .items .nom { font-size: 14px; }
  .items .cos { font-size: 12px; }
  .pista { font-size: 14px; padding: 8px; margin: 0; }
</style>
</head>
<body>
  <h2>Dawn of Cities <small style="font-size:14px">Pre-alpha 7.11.26</small></h2>
  <div id="hud"></div>
  <div id="herramientas"></div>
  <canvas id="mapa" width="640" height="448"></canvas>
  <div id="barra"></div>
  <p class="nota" id="mensaje">💾 Se guarda solo cada mes del juego.</p>
  <p class="nota">👆 Arrastra el mapa para moverte (o usa las flechas / WASD). Toca una casilla para construir.</p>
  <p class="nota">🌲 Bosque: ahí va el Aserradero · ⛰️ Montaña: ahí va la Cantera · 🌊 Agua: solo puentes · ⚠️ = sin camino cerca (no produce)</p>

<script>
// ===== 1. CONFIGURACIÓN =====
const TAM = 32;          // tamaño de cada casilla en píxeles
const COLUMNAS = 100;    // el mapa ahora es enorme
const FILAS = 70;

// Los materiales del juego
const MATERIALES = {
  madera:       { nombre: "madera",       emoji: "🪵" },
  piedra:       { nombre: "piedra",       emoji: "🪨" },
  herramientas: { nombre: "herramientas", emoji: "🔧" }
};

// costo = dinero. materiales = lo que además se gasta al construir.
// solo = el terreno donde obligatoriamente debe ir (edificios de bioma).
const EDIFICIOS = {
  camino:     { nombre: "Camino",     emoji: "🟫", costo: 10,  materiales: { herramientas: 1 },             categoria: "caminos" },
  casa:       { nombre: "Casa",       emoji: "🏠", costo: 50,  materiales: { madera: 5 },                   categoria: "residencial" },
  mercado:    { nombre: "Mercado",    emoji: "🏪", costo: 120, materiales: { madera: 8, piedra: 4 },        categoria: "comercial" },
  granja:     { nombre: "Granja",     emoji: "🌾", costo: 80,  materiales: { madera: 4, herramientas: 1 },  categoria: "industrial" },
  taller:     { nombre: "Taller de herramientas", emoji: "🛠️", costo: 100, materiales: { madera: 10, piedra: 5 }, categoria: "industrial" },
  aserradero: { nombre: "Aserradero", emoji: "🪓", costo: 60,  materiales: { madera: 3, herramientas: 2 },  categoria: "recursos", solo: "bosque" },
  cantera:    { nombre: "Cantera",    emoji: "⛏️", costo: 70,  materiales: { madera: 4, herramientas: 2 },  categoria: "recursos", solo: "montana" }
};

// Las pestañas de la barra de construcción (en este orden)
const CATEGORIAS = {
  caminos:     { nombre: "Caminos",     emoji: "🛣️" },
  residencial: { nombre: "Residencial", emoji: "🏠" },
  comercial:   { nombre: "Comercial",   emoji: "🏪" },
  industrial:  { nombre: "Industrial",  emoji: "🏭" },
  recursos:    { nombre: "Recursos",    emoji: "⛏️" }
};

// Además de las reglas de cada edificio, en estos terrenos solo se permite esto
// (el terreno "llanura" es null y permite todo lo que no tenga "solo")
const TERRENO_PERMITIDO = {
  agua:    ["camino"],   // el camino sobre agua es un puente
  bosque:  ["camino"],
  montana: []
};

const REEMBOLSO = 0.5;   // al demoler te devuelven la mitad (dinero y materiales)

// Producción mensual
const MADERA_POR_ARBOL = 1;     // cada casilla de bosque cerca del aserradero
const PIEDRA_POR_ROCA = 1;      // cada casilla de montaña cerca de la cantera
const TALLER_USA = { madera: 2, piedra: 1 };
const TALLER_PRODUCE = 3;       // herramientas por mes

// Aspecto
const COLOR_CAMINO = "#a07c4a";
const GROSOR_CAMINO = 12;
const COLOR_PUENTE = "#5e3a1a";
const GROSOR_PUENTE = 16;
const COLOR_AGUA = "#4a90d9";
const COLOR_BOSQUE = "#4f8f45";
const COLOR_MONTANA = "#9a9a9a";

// Umbrales de la generación del mapa (ajústalos para cambiar el paisaje)
const UMBRAL_AGUA = 0.25;
const UMBRAL_MONTANA = 0.72;
const UMBRAL_BOSQUE = 0.66;

// ===== 2. ESTADO DEL JUEGO =====
const estado = {
  dinero: 600,
  madera: 40,
  piedra: 20,
  herramientas: 25,
  poblacion: 0,
  anio: 700,
  mes: 1,
  seleccion: "camino"   // lo que tienes elegido en la barra: un edificio o "demoler"
};

const camara = { x: 0, y: 0 };

// Dos capas: TERRENO (agua, bosque, montana o null=llanura) y MAPA (lo construido)
const terreno = [];
const mapa = [];
for (let y = 0; y < FILAS; y++) {
  terreno[y] = [];
  mapa[y] = [];
  for (let x = 0; x < COLUMNAS; x++) {
    terreno[y][x] = null;
    mapa[y][x] = null;
  }
}

let semillaMapa = 0;   // el número que define el mapa aleatorio

// ----- Generador de números aleatorios con semilla -----
// Misma semilla = mismos números = mismo mapa. Así solo guardamos la semilla.
function crearAleatorio(semilla) {
  let a = semilla >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ----- Ruido suave: valores aleatorios en una malla, mezclados entre sí -----
// "celda" es el tamaño de los rasgos: grande = montañas y lagos amplios
function crearRuido(azar, celda) {
  const w = Math.ceil(COLUMNAS / celda) + 2;
  const h = Math.ceil(FILAS / celda) + 2;
  const g = [];
  for (let j = 0; j < h; j++) {
    g[j] = [];
    for (let i = 0; i < w; i++) g[j][i] = azar();
  }
  return function (x, y) {
    const fx = x / celda, fy = y / celda;
    const i = Math.floor(fx), j = Math.floor(fy);
    const tx = fx - i, ty = fy - j;
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);   // suaviza
    const a = g[j][i] + (g[j][i + 1] - g[j][i]) * sx;
    const b = g[j + 1][i] + (g[j + 1][i + 1] - g[j + 1][i]) * sx;
    return a + (b - a) * sy;
  };
}

// Llena el terreno según la semilla y devuelve un buen punto de inicio
function generarTerreno(semilla) {
  const azar = crearAleatorio(semilla);
  const altura1 = crearRuido(azar, 14);
  const altura2 = crearRuido(azar, 6);
  const humedad = crearRuido(azar, 10);

  for (let y = 0; y < FILAS; y++) {
    for (let x = 0; x < COLUMNAS; x++) {
      const h = altura1(x, y) * 0.7 + altura2(x, y) * 0.3;   // altura del terreno
      let t = null;
      if (h < UMBRAL_AGUA) t = "agua";                        // valles bajos = lagos
      else if (h > UMBRAL_MONTANA) t = "montana";             // zonas altas = montañas
      else if (humedad(x, y) > UMBRAL_BOSQUE) t = "bosque";   // zonas húmedas = bosques
      terreno[y][x] = t;
      mapa[y][x] = null;
    }
  }

  // Un río que baja de arriba a abajo, desviándose al azar (2 casillas de ancho)
  let rx = Math.floor(COLUMNAS * (0.2 + azar() * 0.6));
  for (let y = 0; y < FILAS; y++) {
    terreno[y][rx] = "agua";
    terreno[y][rx + 1] = "agua";
    const r = azar();
    if (r < 0.3) rx--; else if (r < 0.6) rx++;
    rx = Math.max(1, Math.min(rx, COLUMNAS - 3));
  }

  // Punto de inicio: la zona de llanura más amplia cerca del centro
  let mejor = { x: COLUMNAS >> 1, y: FILAS >> 1, puntos: -1 };
  for (let y = Math.floor(FILAS * 0.25); y < FILAS * 0.75; y++) {
    for (let x = Math.floor(COLUMNAS * 0.25); x < COLUMNAS * 0.75; x++) {
      const p = contarZona(x, y, 4, null);
      if (p > mejor.puntos) mejor = { x: x, y: y, puntos: p };
    }
  }
  return mejor;
}

// Cuenta casillas de un tipo de terreno en un cuadrado de radio r alrededor de (x, y)
function contarZona(x, y, r, tipo) {
  let total = 0;
  for (let j = y - r; j <= y + r; j++) {
    for (let i = x - r; i <= x + r; i++) {
      if (i < 0 || i >= COLUMNAS || j < 0 || j >= FILAS) continue;
      if (terreno[j][i] === tipo) total++;
    }
  }
  return total;
}

// Prueba semillas derivadas hasta que cerca del inicio haya bosque y montaña
function generarMundo(semillaBase) {
  let inicio = null;
  for (let intento = 0; intento < 40; intento++) {
    inicio = generarTerreno(semillaBase + intento * 7919);
    const bosque = contarZona(inicio.x, inicio.y, 14, "bosque");
    const montana = contarZona(inicio.x, inicio.y, 14, "montana");
    if (bosque >= 25 && montana >= 12) break;
  }
  return inicio;
}

function centrarCamara(punto) {
  camara.x = punto.x * TAM - canvas.width / 2;
  camara.y = punto.y * TAM - canvas.height / 2;
}

function iniciarNuevo() {
  semillaMapa = Math.floor(Math.random() * 1000000000);
  centrarCamara(generarMundo(semillaMapa));
}

// ===== 3. SIMULACIÓN =====
function esCamino(x, y) {
  if (x < 0 || x >= COLUMNAS || y < 0 || y >= FILAS) return false;
  return mapa[y][x] === "camino";
}

function tieneCamino(x, y) {
  return esCamino(x, y - 1) || esCamino(x, y + 1) ||
         esCamino(x - 1, y) || esCamino(x + 1, y);
}

// Recorre el mapa UNA vez y cuenta todo lo necesario para el turno
function contar() {
  const r = { todos: {}, activos: {}, madera: 0, piedra: 0 };
  for (const id in EDIFICIOS) { r.todos[id] = 0; r.activos[id] = 0; }

  for (let y = 0; y < FILAS; y++) {
    for (let x = 0; x < COLUMNAS; x++) {
      const id = mapa[y][x];
      if (!id) continue;
      r.todos[id]++;
      if (id === "camino" || !tieneCamino(x, y)) continue;   // sin camino: no produce
      r.activos[id]++;
      // Los edificios de bioma producen según cuánto bioma hay a su alrededor (3x3)
      if (id === "aserradero") r.madera += contarZona(x, y, 1, "bosque") * MADERA_POR_ARBOL;
      if (id === "cantera")    r.piedra += contarZona(x, y, 1, "montana") * PIEDRA_POR_ROCA;
    }
  }
  return r;
}

function turno() {
  const c = contar();

  estado.poblacion = c.activos.casa * 4;

  // Dinero
  const ingresos = estado.poblacion * 1 + c.activos.granja * 5 + c.activos.mercado * 8;
  let edificios = 0;
  for (const id in c.todos) if (id !== "camino") edificios += c.todos[id];
  const gastos = edificios * 2 + c.todos.camino * 1;
  estado.dinero += ingresos - gastos;

  // Materiales extraídos
  estado.madera += c.madera;
  estado.piedra += c.piedra;

  // Cada taller convierte madera y piedra en herramientas (si alcanza)
  for (let i = 0; i < c.activos.taller; i++) {
    if (estado.madera >= TALLER_USA.madera && estado.piedra >= TALLER_USA.piedra) {
      estado.madera -= TALLER_USA.madera;
      estado.piedra -= TALLER_USA.piedra;
      estado.herramientas += TALLER_PRODUCE;
    }
  }

  estado.mes++;
  if (estado.mes > 12) {
    estado.mes = 1;
    estado.anio++;
  }
  guardar(true);   // autoguardado silencioso cada mes del juego
  dibujar();
}

// ¿Se puede construir este edificio en esta casilla? (según el terreno)
function sePuedeConstruir(id, x, y) {
  const e = EDIFICIOS[id];
  const t = terreno[y][x];
  if (e.solo) return t === e.solo;
  if (t === null) return true;
  return TERRENO_PERMITIDO[t].indexOf(id) !== -1;
}

// Lo que falta para poder pagar un edificio (lista vacía = alcanza todo)
function faltantes(e) {
  const falta = [];
  if (estado.dinero < e.costo) falta.push("dinero");
  for (const m in e.materiales) {
    if (estado[m] < e.materiales[m]) falta.push(MATERIALES[m].nombre);
  }
  return falta;
}

function textoCosto(e) {
  let t = "$" + e.costo;
  for (const m in e.materiales) t += " " + MATERIALES[m].emoji + e.materiales[m];
  return t;
}

// ===== 4. VISUAL =====
const canvas = document.getElementById("mapa");
const ctx = canvas.getContext("2d");

function dibujarCamino(x, y) {
  const cx = x * TAM + TAM / 2;
  const cy = y * TAM + TAM / 2;

  // Si debajo hay agua, es un puente: otro color y más grueso
  const esPuente = terreno[y][x] === "agua";
  const color = esPuente ? COLOR_PUENTE : COLOR_CAMINO;
  const grosor = esPuente ? GROSOR_PUENTE : GROSOR_CAMINO;

  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = grosor;
  ctx.lineCap = "butt";

  ctx.beginPath();
  ctx.arc(cx, cy, grosor / 2, 0, Math.PI * 2);
  ctx.fill();

  if (esCamino(x, y - 1)) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - TAM / 2); ctx.stroke(); }
  if (esCamino(x, y + 1)) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + TAM / 2); ctx.stroke(); }
  if (esCamino(x - 1, y)) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - TAM / 2, cy); ctx.stroke(); }
  if (esCamino(x + 1, y)) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + TAM / 2, cy); ctx.stroke(); }
}

function limitarCamara() {
  const maxX = COLUMNAS * TAM - canvas.width;
  const maxY = FILAS * TAM - canvas.height;
  camara.x = Math.max(0, Math.min(camara.x, maxX));
  camara.y = Math.max(0, Math.min(camara.y, maxY));
}

function dibujar() {
  limitarCamara();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-camara.x, -camara.y);

  const x0 = Math.max(0, Math.floor(camara.x / TAM));
  const x1 = Math.min(COLUMNAS - 1, Math.ceil((camara.x + canvas.width) / TAM));
  const y0 = Math.max(0, Math.floor(camara.y / TAM));
  const y1 = Math.min(FILAS - 1, Math.ceil((camara.y + canvas.height) / TAM));

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const celda = mapa[y][x];
      const t = terreno[y][x];

      // 1) El terreno
      if (t === "agua")    { ctx.fillStyle = COLOR_AGUA;    ctx.fillRect(x * TAM, y * TAM, TAM, TAM); }
      if (t === "bosque")  { ctx.fillStyle = COLOR_BOSQUE;  ctx.fillRect(x * TAM, y * TAM, TAM, TAM); }
      if (t === "montana") { ctx.fillStyle = COLOR_MONTANA; ctx.fillRect(x * TAM, y * TAM, TAM, TAM); }

      ctx.strokeStyle = "rgba(0,0,0,0.15)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x * TAM, y * TAM, TAM, TAM);

      // 2) Lo construido (o, si no hay nada, el dibujo del bioma)
      if (celda === "camino") {
        dibujarCamino(x, y);
      } else if (celda) {
        const conCamino = tieneCamino(x, y);
        ctx.globalAlpha = conCamino ? 1 : 0.5;
        ctx.font = "24px serif";
        ctx.fillText(EDIFICIOS[celda].emoji, x * TAM + TAM / 2, y * TAM + TAM / 2);
        ctx.globalAlpha = 1;

        if (!conCamino) {
          ctx.font = "12px serif";
          ctx.fillText("⚠️", x * TAM + TAM - 8, y * TAM + 8);
        }
      } else if (t === "bosque" || t === "montana") {
        ctx.font = "22px serif";
        ctx.fillText(t === "bosque" ? "🌲" : "⛰️", x * TAM + TAM / 2, y * TAM + TAM / 2);
      }
    }
  }

  ctx.restore();

  document.getElementById("hud").textContent =
    "📅 Año " + estado.anio + " (mes " + estado.mes + ")  💰 " + estado.dinero +
    "  👥 " + estado.poblacion + "  🪵 " + estado.madera + "  🪨 " + estado.piedra +
    "  🔧 " + estado.herramientas;
}

// ===== 5. CONTROLES =====
const contenedor = document.getElementById("herramientas");   // fila superior (guardar / nueva partida)
const barra = document.getElementById("barra");

let categoriaActiva = "caminos";

function edificiosDe(categoria) {
  const lista = [];
  for (const id in EDIFICIOS) {
    if (EDIFICIOS[id].categoria === categoria) lista.push(id);
  }
  return lista;
}

function categoriaDe(seleccion) {
  return seleccion === "demoler" ? "demoler" : EDIFICIOS[seleccion].categoria;
}

function elegirCategoria(idCat) {
  categoriaActiva = idCat;
  if (idCat === "demoler") {
    estado.seleccion = "demoler";
  } else {
    const lista = edificiosDe(idCat);
    if (lista.indexOf(estado.seleccion) === -1) estado.seleccion = lista[0];
  }
  construirBarra();
}

function construirBarra() {
  barra.innerHTML = "";

  const pestanas = document.createElement("div");
  pestanas.className = "pestanas";
  for (const idCat in CATEGORIAS) {
    const b = document.createElement("button");
    b.textContent = CATEGORIAS[idCat].emoji + " " + CATEGORIAS[idCat].nombre;
    b.className = (idCat === categoriaActiva) ? "activo" : "";
    b.onclick = function () { elegirCategoria(idCat); };
    pestanas.appendChild(b);
  }
  const bDemoler = document.createElement("button");
  bDemoler.textContent = "🔨 Demoler";
  bDemoler.className = (categoriaActiva === "demoler") ? "activo" : "";
  bDemoler.onclick = function () { elegirCategoria("demoler"); };
  pestanas.appendChild(bDemoler);
  barra.appendChild(pestanas);

  if (categoriaActiva === "demoler") {
    const pista = document.createElement("p");
    pista.className = "pista";
    pista.textContent = "Toca un camino o edificio para demolerlo y recuperar " + Math.round(REEMBOLSO * 100) + "% del costo.";
    barra.appendChild(pista);
    return;
  }

  const items = document.createElement("div");
  items.className = "items";
  for (const id of edificiosDe(categoriaActiva)) {
    const e = EDIFICIOS[id];
    const b = document.createElement("button");
    b.className = "item" + (id === estado.seleccion ? " activo" : "");
    b.innerHTML = '<span class="emo">' + e.emoji + '</span><span class="nom">' + e.nombre +
                  '</span><span class="cos">' + textoCosto(e) + '</span>';
    b.onclick = function () {
      estado.seleccion = id;
      construirBarra();
    };
    items.appendChild(b);
  }
  barra.appendChild(items);
}

function actualizarBotones() {
  categoriaActiva = categoriaDe(estado.seleccion);
  construirBarra();
}

// Acción al tocar una casilla (construir o demoler)
function accionEnCasilla(x, y) {
  if (x < 0 || x >= COLUMNAS || y < 0 || y >= FILAS) return;
  const celda = mapa[y][x];

  if (estado.seleccion === "demoler") {
    if (celda === null) return;
    const e = EDIFICIOS[celda];
    estado.dinero += Math.floor(e.costo * REEMBOLSO);
    for (const m in e.materiales) estado[m] += Math.floor(e.materiales[m] * REEMBOLSO);
    mapa[y][x] = null;
    dibujar();
    return;
  }

  if (celda !== null) return;   // casilla ocupada
  const id = estado.seleccion;
  const edificio = EDIFICIOS[id];

  if (!sePuedeConstruir(id, x, y)) {
    mostrarMensaje(edificio.solo
      ? "⚠️ " + edificio.nombre + " solo se construye sobre " + (edificio.solo === "bosque" ? "bosque 🌲" : "montaña ⛰️") + "."
      : "⚠️ No se puede construir eso en este terreno.");
    return;
  }
  const falta = faltantes(edificio);
  if (falta.length > 0) {
    mostrarMensaje("⚠️ Te falta: " + falta.join(", ") + ".");
    return;
  }

  estado.dinero -= edificio.costo;
  for (const m in edificio.materiales) estado[m] -= edificio.materiales[m];
  mapa[y][x] = id;
  dibujar();
}

// Arrastrar para mover la cámara. Si el dedo casi no se mueve, es un toque.
let arrastrando = false;
let movio = false;
let inicio = { x: 0, y: 0, camX: 0, camY: 0 };

canvas.addEventListener("pointerdown", function (e) {
  arrastrando = true;
  movio = false;
  inicio = { x: e.clientX, y: e.clientY, camX: camara.x, camY: camara.y };
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", function (e) {
  if (!arrastrando) return;
  const dx = e.clientX - inicio.x;
  const dy = e.clientY - inicio.y;
  if (Math.abs(dx) + Math.abs(dy) > 8) movio = true;

  if (movio) {
    const escala = canvas.width / canvas.getBoundingClientRect().width;
    camara.x = inicio.camX - dx * escala;
    camara.y = inicio.camY - dy * escala;
    dibujar();
  }
});

canvas.addEventListener("pointerup", function (e) {
  if (!arrastrando) return;
  arrastrando = false;
  if (movio) return;

  const rect = canvas.getBoundingClientRect();
  const escala = canvas.width / rect.width;
  const mundoX = (e.clientX - rect.left) * escala + camara.x;
  const mundoY = (e.clientY - rect.top) * escala + camara.y;
  accionEnCasilla(Math.floor(mundoX / TAM), Math.floor(mundoY / TAM));
});

window.addEventListener("keydown", function (e) {
  const paso = TAM * 2;
  const k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "a") camara.x -= paso;
  else if (k === "arrowright" || k === "d") camara.x += paso;
  else if (k === "arrowup" || k === "w") camara.y -= paso;
  else if (k === "arrowdown" || k === "s") camara.y += paso;
  else return;
  e.preventDefault();
  dibujar();
});

// ===== 6. GUARDADO =====
// Del mapa solo guardamos la SEMILLA (el terreno se regenera igual) y la lista de
// construcciones. Así el guardado es pequeño aunque el mapa sea enorme.
const CLAVE_GUARDADO = "dawn-of-cities-partida";
const VERSION_GUARDADO = 2;   // subió a 2: el formato cambió (semilla + construcciones)
let borrando = false;

function mostrarMensaje(texto) {
  document.getElementById("mensaje").textContent = texto;
}

function guardar(silencioso) {
  if (borrando) return;
  try {
    const construcciones = [];
    for (let y = 0; y < FILAS; y++) {
      for (let x = 0; x < COLUMNAS; x++) {
        if (mapa[y][x]) construcciones.push([x, y, mapa[y][x]]);
      }
    }
    const datos = { version: VERSION_GUARDADO, semilla: semillaMapa, estado: estado,
                    camara: camara, construcciones: construcciones };
    localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(datos));
    if (!silencioso) mostrarMensaje("💾 Partida guardada");
  } catch (e) {
    mostrarMensaje("⚠️ No se pudo guardar (¿modo incógnito o almacenamiento bloqueado?)");
  }
}

// Devuelve true si cargó una partida; false si hay que empezar una nueva
function cargar() {
  try {
    const texto = localStorage.getItem(CLAVE_GUARDADO);
    if (!texto) return false;

    const datos = JSON.parse(texto);
    if (datos.version !== VERSION_GUARDADO) {
      mostrarMensaje("⚠️ El guardado es de una versión anterior. Empezamos partida nueva.");
      return false;
    }
    if (typeof datos.semilla !== "number" || !Array.isArray(datos.construcciones)) return false;

    // Primero se revisa todo; si algo está mal, no se toca nada
    const validas = [];
    for (const c of datos.construcciones) {
      if (!Array.isArray(c)) continue;
      const x = c[0], y = c[1], id = c[2];
      if (Number.isInteger(x) && Number.isInteger(y) && x >= 0 && x < COLUMNAS &&
          y >= 0 && y < FILAS && EDIFICIOS.hasOwnProperty(id)) validas.push(c);
    }

    semillaMapa = datos.semilla;
    const punto = generarMundo(semillaMapa);   // regenera el mismo terreno
    for (const c of validas) mapa[c[1]][c[0]] = c[2];

    const e = datos.estado || {};
    for (const campo of ["dinero", "madera", "piedra", "herramientas", "poblacion", "anio", "mes"]) {
      if (typeof e[campo] === "number") estado[campo] = e[campo];
    }
    if (e.seleccion === "demoler" || EDIFICIOS.hasOwnProperty(e.seleccion)) {
      estado.seleccion = e.seleccion;
    }
    if (datos.camara && typeof datos.camara.x === "number" && typeof datos.camara.y === "number") {
      camara.x = datos.camara.x;
      camara.y = datos.camara.y;
    } else {
      centrarCamara(punto);
    }
    mostrarMensaje("📂 Partida cargada");
    return true;
  } catch (e) {
    mostrarMensaje("⚠️ No se pudo cargar la partida guardada.");
    return false;
  }
}

const botonGuardar = document.createElement("button");
botonGuardar.textContent = "💾 Guardar";
botonGuardar.onclick = function () { guardar(false); };
contenedor.appendChild(botonGuardar);

const botonNueva = document.createElement("button");
botonNueva.textContent = "🗑️ Nueva partida";
botonNueva.onclick = function () {
  if (!confirm("¿Borrar la partida guardada y empezar de nuevo con un mapa nuevo?")) return;
  borrando = true;
  try { localStorage.removeItem(CLAVE_GUARDADO); } catch (e) {}
  location.reload();
};
contenedor.appendChild(botonNueva);

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "hidden") guardar(true);
});
window.addEventListener("pagehide", function () { guardar(true); });

// ===== 7. INICIO =====
if (!cargar()) iniciarNuevo();
actualizarBotones();
dibujar();
setInterval(turno, 1500);
</script>
