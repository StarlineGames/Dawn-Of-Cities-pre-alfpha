<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawn of Cities</title>
<style>
  body { font-family: sans-serif; background: #2b2b2b; color: white; text-align: center; margin: 0; }
  #hud { padding: 8px; font-size: 18px; }
  button { padding: 8px 12px; margin: 2px; font-size: 16px; }
  button.activo { background: #f5c542; }
  canvas { background: #7bb661; cursor: pointer; max-width: 100%; touch-action: manipulation; }
</style>
</head>
<body>
  <h2>Dawn of Cities</h2>
  <div id="hud"></div>
  <div id="herramientas"></div>
  <canvas id="mapa" width="640" height="448"></canvas>
  <p style="font-size:14px">⚠️ = edificio sin camino cercano (no produce)</p>

<script>
// ===== 1. CONFIGURACIÓN =====
const TAM = 32;
const COLUMNAS = 20;
const FILAS = 14;

const EDIFICIOS = {
  camino:  { nombre: "Camino",  emoji: "🟫", costo: 10 },
  casa:    { nombre: "Casa",    emoji: "🏠", costo: 50 },
  granja:  { nombre: "Granja",  emoji: "🌾", costo: 80 },
  mercado: { nombre: "Mercado", emoji: "🏪", costo: 120 }
};

// ===== 2. ESTADO DEL JUEGO =====
const estado = {
  dinero: 500,
  poblacion: 0,
  anio: 700,
  mes: 1,
  herramienta: "camino"
};

const mapa = [];
for (let y = 0; y < FILAS; y++) {
  mapa[y] = [];
  for (let x = 0; x < COLUMNAS; x++) {
    mapa[y][x] = null;
  }
}
for (let y = 3; y <= 7; y++) {
  for (let x = 14; x <= 17; x++) {
    mapa[y][x] = "agua";
  }
}

// ===== 3. SIMULACIÓN =====

// ¿Hay un camino en esta casilla? (también revisa que no nos salgamos del mapa)
function esCamino(x, y) {
  if (x < 0 || x >= COLUMNAS || y < 0 || y >= FILAS) return false;
  return mapa[y][x] === "camino";
}

// ¿Alguna de las 4 casillas vecinas es un camino?
function tieneCamino(x, y) {
  return esCamino(x, y - 1) ||   // arriba
         esCamino(x, y + 1) ||   // abajo
         esCamino(x - 1, y) ||   // izquierda
         esCamino(x + 1, y);     // derecha
}

// Cuenta edificios de un tipo, pero SOLO los que tienen camino cerca
function contarActivos(tipo) {
  let total = 0;
  for (let y = 0; y < FILAS; y++) {
    for (let x = 0; x < COLUMNAS; x++) {
      if (mapa[y][x] === tipo && tieneCamino(x, y)) total++;
    }
  }
  return total;
}

// Cuenta todos los edificios de un tipo (con o sin camino)
function contarTodos(tipo) {
  let total = 0;
  for (let y = 0; y < FILAS; y++) {
    for (let x = 0; x < COLUMNAS; x++) {
      if (mapa[y][x] === tipo) total++;
    }
  }
  return total;
}

function turno() {
  const casas = contarActivos("casa");
  const granjas = contarActivos("granja");
  const mercados = contarActivos("mercado");
  const caminos = contarTodos("camino");

  estado.poblacion = casas * 4;

  const ingresos = estado.poblacion * 1 + granjas * 5 + mercados * 8;
  // Todos los edificios cuestan mantenimiento, y cada camino cuesta 1
  const edificiosTotales = contarTodos("casa") + contarTodos("granja") + contarTodos("mercado");
  const gastos = edificiosTotales * 2 + caminos * 1;
  estado.dinero += ingresos - gastos;

  estado.mes++;
  if (estado.mes > 12) {
    estado.mes = 1;
    estado.anio++;
  }
  dibujar();
}

// ===== 4. VISUAL =====
const canvas = document.getElementById("mapa");
const ctx = canvas.getContext("2d");

function dibujarCamino(x, y) {
  const cx = x * TAM + TAM / 2;   // centro de la casilla
  const cy = y * TAM + TAM / 2;

  ctx.strokeStyle = "#a07c4a";
  ctx.fillStyle = "#a07c4a";
  ctx.lineWidth = 12;
  ctx.lineCap = "butt";

  // un puntito en el centro
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.fill();

  // una línea hacia cada vecino que también sea camino
  if (esCamino(x, y - 1)) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - TAM / 2); ctx.stroke(); }
  if (esCamino(x, y + 1)) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + TAM / 2); ctx.stroke(); }
  if (esCamino(x - 1, y)) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - TAM / 2, cy); ctx.stroke(); }
  if (esCamino(x + 1, y)) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + TAM / 2, cy); ctx.stroke(); }
}

function dibujar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < FILAS; y++) {
    for (let x = 0; x < COLUMNAS; x++) {
      const celda = mapa[y][x];

      if (celda === "agua") {
        ctx.fillStyle = "#4a90d9";
        ctx.fillRect(x * TAM, y * TAM, TAM, TAM);
      }

      ctx.strokeStyle = "rgba(0,0,0,0.15)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x * TAM, y * TAM, TAM, TAM);

      if (celda === "camino") {
        dibujarCamino(x, y);
      } else if (celda && celda !== "agua") {
        const conCamino = tieneCamino(x, y);
        ctx.globalAlpha = conCamino ? 1 : 0.5;   // semitransparente si no tiene camino
        ctx.font = "24px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(EDIFICIOS[celda].emoji, x * TAM + TAM / 2, y * TAM + TAM / 2);
        ctx.globalAlpha = 1;

        if (!conCamino) {
          ctx.font = "12px serif";
          ctx.fillText("⚠️", x * TAM + TAM - 8, y * TAM + 8);
        }
      }
    }
  }

  document.getElementById("hud").textContent =
    "📅 Año " + estado.anio + " (mes " + estado.mes + ")   💰 " +
    estado.dinero + "   👥 " + estado.poblacion;
}

// ===== 5. CONTROLES =====
const contenedor = document.getElementById("herramientas");
for (const id in EDIFICIOS) {
  const e = EDIFICIOS[id];
  const boton = document.createElement("button");
  boton.textContent = e.emoji + " " + e.nombre + " ($" + e.costo + ")";
  boton.onclick = function () {
    estado.herramienta = id;
    actualizarBotones();
  };
  boton.id = "btn-" + id;
  contenedor.appendChild(boton);
}

function actualizarBotones() {
  for (const id in EDIFICIOS) {
    document.getElementById("btn-" + id).className =
      (id === estado.herramienta) ? "activo" : "";
  }
}

canvas.addEventListener("pointerdown", function (evento) {
  const rect = canvas.getBoundingClientRect();
  const escala = canvas.width / rect.width;
  const x = Math.floor((evento.clientX - rect.left) * escala / TAM);
  const y = Math.floor((evento.clientY - rect.top) * escala / TAM);

  if (x < 0 || x >= COLUMNAS || y < 0 || y >= FILAS) return;  // fuera del mapa
  if (mapa[y][x] !== null) return;
  const edificio = EDIFICIOS[estado.herramienta];
  if (estado.dinero < edificio.costo) return;

  estado.dinero -= edificio.costo;
  mapa[y][x] = estado.herramienta;
  dibujar();
});

// ===== 6. INICIO =====
actualizarBotones();
dibujar();
setInterval(turno, 1500);
</script>
</body>
</html>
